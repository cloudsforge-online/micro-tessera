name: CI

# ────────────────────────────────────────────────────────────────────────────────────────────────
# THIS REPOSITORY HAD NO CI AT ALL. Nine commits, 97 tests against a real Postgres, an image built
# and driven end to end by hand — and not one line of any of that had ever run anywhere but on the
# machine that wrote it.
#
# It is a CALL rather than a bespoke file, and that is the estate's settled answer: micro-worlds'
# 167 hand-written lines said of themselves that everything but the repository-specific rules was
# "a liability with a deletion date". A copy here would start life 167 lines behind and drift from
# the day it landed.
#
# WHAT THE SHARED WORKFLOW BRINGS THAT NOTHING HERE HAS EVER HAD:
#
#   * Rule 1 — this service may read ONE database variable, its own. Enforced against source.
#   * The scope audit. Every scope a route gate demands must exist in the registry in
#     @cloudsforge/contracts-auth, because identity refuses to mint a token naming an unknown
#     scope: an unregistered scope is a service-to-service surface no identity-issued token can
#     ever reach, and the suite stays green regardless because it mints its own principals. This
#     repository gates on three — tessera:provision, tessera:read and tessera:write — and
#     contracts-auth/src/index.ts registers all three, with the line numbers in its own
#     comment read off THIS repository's server.ts. That agreement has never been machine-checked.
#   * The image job, which is the one that matters most here. See below.
# ────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: tessera
      database-env-var: TESSERA_DATABASE_URL
      # 4022, and the number is argued rather than picked — src/env.ts and 23-tessera.md
      # §10.1. Deliberately BELOW the derived 4100+ compose block, so no number of repositories
      # appended to `deployableRepos()` can grow into it. `.env.example` and src/env.ts must agree
      # with this line; they do.
      port: 4022
      # Match production rather than the workflow's default of 16: the estate's compose files pin
      # postgres:17-alpine, and a suite that passes on a version nobody runs proves nothing.
      postgres-version: '17'
      # ── THE IMAGE IS RUN, NOT READ, AND THAT IS THE POINT OF LANDING THIS AT ALL ──
      #
      # This Dockerfile resolves its `link:` dependencies from TWO NAMED BUILD CONTEXTS —
      # `COPY --from=runtimepkgs` (Dockerfile:30-31) and `COPY --from=contractspkgs` (36-37). The
      # shared workflow checks micro-runtime and micro-contracts out as siblings and passes both as
      # `build-contexts`, which is the only way this image builds at all outside a full estate
      # checkout.
      #
      # And building it is not the assertion. micro-service-template's image could not boot for
      # MONTHS while its CI was green, because the job read the image's metadata instead of running
      # it. The shared job starts the container against the same Postgres the test job gets,
      # migrates it with the image's own migrator, and reads /livez — which is why the smoke-env
      # below has to be real.
      #
      # Exactly what `loadEnv` demands and nothing else. TESSERA_DATABASE_URL is supplied by the
      # job. The identity URLs are never dialled, because /livez verifies no token, and they are
      # CI-only NON-secrets. Never a real credential.
      #
      # THE TWO SIGNING VARIABLES ARE NOT IN THAT CATEGORY ANY MORE, and the value they used to
      # carry is why. `ci-only-not-a-real-secret-…` cleared the old guard for the same reason the
      # estate's `estate-only-outbox-secret-…` did — a deny-list of exact strings plus a
      # 24-character floor, and neither string was on any list (micro-org #142). The boot guard now
      # checks the SHAPE and has no CI exemption, so `@generate` asks service-ci.yml for a fresh
      # `openssl rand -base64 48` per line per run: CI holds a real secret rather than a string
      # claiming to be one. The two lines each get their OWN value, which is what proves they are
      # separate variables rather than one read twice.
      #
      # The optional upstreams — STUDIO_URL, LEDGER_URL, MARKET_URL, COMMUNITY_URL — and BOTH
      # credential variables are deliberately absent: `.env.example` states that ABSENT IS A
      # SUPPORTED MODE, the Kiln answers 503 `kiln_unconfigured` and every other route works.
      # Setting them here would test a configuration no deployment uses and hide the one this
      # service promises to survive.
      #
      # THAT IS A DELIBERATE CHOICE AFTER micro-org #222, NOT AN OVERSIGHT. The fix wires
      # `ServiceTokenProvider` into the studio and ledger clients so a 600-second token
      # (identity/src/tokens.ts) is exchanged and refreshed rather than read once at boot. It
      # would have been easy to set a credential here and call the seam covered — but a smoke test
      # cannot reach past ten minutes, so it would prove only that a string was present. The seam is
      # proved in `src/servicetoken.test.ts` instead, which drives the real wiring through
      # `buildUpstreams` with the clock ELEVEN MINUTES on and asserts the call costs zero 401s. What
      # this job proves is the other half and the half only it can: that a container given no
      # credential at all still boots and serves.
      #
      # IDENTITY_URL is absent for a different reason: `src/env.ts` requires it but DEFAULTS it to
      # IDENTITY_ISSUER, which is already here and is identity's origin on both estates. A line
      # would be redundant, and `src/env.test.ts` pins the default so it cannot silently stop.
      #
      # Nothing below was weakened to make this pass. The credential guard has no CI exemption.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4100/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4100
        OUTBOX_SIGNING_SECRET=@generate
        INBOUND_SIGNING_SECRET=@generate
    secrets:
      # @cloudsforge/* resolves through link:../runtime and link:../contracts rather than a
      # registry, so the workflow checks out micro-runtime and micro-contracts as siblings. Both are
      # private, so it needs a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts, image name derived
  # at tools/registry.ts); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts); and deploy/scripts/release-deploy.sh refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [estate]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
